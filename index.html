<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Котячий фокус</title>
<style>
:root{--bg:#f7eee5;--bg2:#ebd9c7;--card:#fffaf3;--line:#ead9c7;--ink:#30251f;--ink-t:#ffffff;--muted:#806f61;--shadow:#bca38c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#241b16;--bg2:#3a2b21;--card:#33271f;--line:#4b3a2e;--ink:#f2e6d8;--ink-t:#30251f;--muted:#b9a592;--shadow:#6f5a49}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#241b16;--bg2:#3a2b21;--card:#33271f;--line:#4b3a2e;--ink:#f2e6d8;--ink-t:#30251f;--muted:#b9a592;--shadow:#6f5a49}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#intro{text-align:center;padding:30px 24px;width:min(90%,420px);background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:0 14px 40px rgba(81,58,42,.12);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.paw{font-size:38px;margin-bottom:8px}
h1{font-size:28px;line-height:1.15;margin:0 0 12px;letter-spacing:-.7px}
#intro p{color:var(--muted);font-weight:650;line-height:1.45;margin:0 0 24px}
button{border:0;border-radius:17px;background:var(--ink);color:var(--ink-t);font:800 18px system-ui,sans-serif;padding:16px 22px;width:100%;box-shadow:0 6px 0 var(--shadow);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
#party{display:none;position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2))}
#pile{position:absolute;inset:0}
.kitty{position:absolute;height:auto;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(60,40,28,.25));will-change:transform;opacity:0}
#counter{position:absolute;z-index:2000;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(81,58,42,.18);transition:opacity .4s}
#headline{position:absolute;z-index:2100;left:5%;right:5%;top:50%;transform:translateY(-50%) scale(.6);opacity:0;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px 16px;box-shadow:0 18px 50px rgba(60,40,28,.35);pointer-events:none;transition:transform .6s cubic-bezier(.2,1.4,.4,1),opacity .4s;max-width:520px;margin:0 auto}
#headline.show{transform:translateY(-50%) scale(1);opacity:1}
#headline .yay{font-size:clamp(28px,8vw,44px);line-height:1.1;font-weight:900;letter-spacing:-1px}
#headline p{margin:10px 0 0;font-size:clamp(16px,4.4vw,21px);font-weight:700;color:var(--muted)}
#again{display:none;position:absolute;z-index:2200;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:90%;max-width:360px;opacity:0;transition:opacity .5s}
#again.show{opacity:1}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>
<main id="intro">
  <div class="paw">🐾</div>
  <h1>Є маленький фокус…</h1>
  <p>Готові побачити, що станеться, якщо зібрати всіх котів?</p>
  <button id="start">Побачити фокус ✨</button>
</main>
<section id="party">
  <div id="pile"></div>
  <div id="counter">Зібрано котів: <span id="n">0</span></div>
  <div id="headline"><div class="yay">Вітаємо! 🐾</div><p>Ви зібрали всіх котів!</p></div>
  <button id="again">Ще раз! 🐈</button>
</section>

const intro=document.getElementById('intro'),party=document.getElementById('party'),pile=document.getElementById('pile'),
      again=document.getElementById('again'),headline=document.getElementById('headline'),counter=document.getElementById('counter'),nEl=document.getElementById('n');
let timers=[];
const imgs=cats.map(src=>{const i=new Image();i.src=src;return i});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function launch(){
  timers.forEach(clearTimeout);timers=[];
  intro.style.display='none';party.style.display='block';
  pile.innerHTML='';headline.classList.remove('show');again.classList.remove('show');again.style.display='none';
  counter.style.opacity=1;nEl.textContent='0';
  const W=innerWidth,H=innerHeight;
  const w=Math.max(78,Math.min(130,W*0.26)),h=w*1.12;
  const colStep=w*0.72,rowStep=h*0.5;
  const cols=Math.ceil(W/colStep)+1,rows=Math.ceil(H/rowStep)+1;
  // слоти: від низу екрана вгору, щоб купа росла знизу
  const slots=[];
  for(let r=0;r<rows;r++){
    const y=H-h*0.92-r*rowStep;
    const row=[];
    for(let c=0;c<cols;c++){
      const x=-w*0.35+c*colStep+(r%2?colStep/2:0)+(Math.random()-.5)*w*0.18;
      row.push({x,y:y+(Math.random()-.5)*h*0.12,r});
    }
    slots.push(...shuffle(row));
  }
  const total=slots.length;
  const span=Math.min(7000,Math.max(4200,total*85));
  let landed=0;
  slots.forEach((s,i)=>{
    const img=document.createElement('img');
    img.className='kitty';img.alt='';
    const k=(Math.random()*cats.length)|0;
    img.src=cats[(i+k)%cats.length];
    img.style.width=(w*(0.92+Math.random()*0.16))+'px';
    img.style.left=s.x+'px';img.style.top=s.y+'px';
    img.style.zIndex=String(100+Math.round(s.y+h)+Math.random()*3|0);
    pile.appendChild(img);
    const rot=(Math.random()-.5)*28;
    const fall=s.y+h+60;
    const delay=(i/total)*span;
    const dur=520+Math.min(520,fall*0.45);
    timers.push(setTimeout(()=>{
      img.style.opacity=1;
      const a=img.animate([
        {transform:`translateY(${-fall}px) rotate(${rot-60}deg)`,offset:0,easing:'cubic-bezier(.5,0,.9,.6)'},
        {transform:`translateY(0) rotate(${rot}deg)`,offset:.78,easing:'ease-out'},
        {transform:`translateY(-9px) rotate(${rot}deg)`,offset:.89,easing:'ease-in'},
        {transform:`translateY(0) rotate(${rot}deg)`,offset:1}
      ],{duration:dur,fill:'forwards'});
      timers.push(setTimeout(()=>{landed++;nEl.textContent=landed},dur*0.78));
    },delay));
  });
  timers.push(setTimeout(()=>{
    nEl.textContent=total;
    counter.style.opacity=0;
    headline.classList.add('show');
    again.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>again.classList.add('show')));
    try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(e){}
  },span+1100));
}
document.getElementById('start').addEventListener('click',launch);
again.addEventListener('click',launch);
</script></body></html>
